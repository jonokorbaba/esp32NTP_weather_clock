; PlatformIO project — ESP32 (classic, dual-core) NTP Weather Clock
; Board: generic ESP32 dev module. Change `board` if you're using a specific
; variant (esp-wrover-kit, nodemcu-32s, etc.) — esp32dev works for most
; generic 30/38-pin devkits.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    bblanchon/ArduinoJson @ ^7.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
